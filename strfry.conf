db = "/var/lib/strfry/"

dbParams {
    maxreaders = 256
    mapsize = 10995116277760
}

events {
    # Taille max d un event Nostr (JSON normalise). Aligne sur le payload WS (128 KiB)
    # pour permettre les NIP-23 articles longs et les NIP-94 metadata riches.
    # Norme courante chez les relais strfry publics : 128 KiB (nos.lol, offchain.pub).
    # Damus = 400KB, Primal = 1MB pour comparaison.
    maxEventSize = 131072

    # Coherence avec retention.sh (cron 03:00 UTC) qui purge les events > 5 ans.
    # Default strfry = 3 ans, mais alors un user republiant un event de 4 ans serait
    # rejete a l ecriture. 5 ans = 157 680 000 secondes.
    rejectEventsOlderThanSeconds = 157680000
}

relay {
    bind = "127.0.0.1"
    port = 7777
    nofiles = 1000000
    # realIpHeader desactive : on prefere anonymiser les IPs cote strfry.
    # Caddy log les IPs masquees en /24 (cf. Caddyfile), suffisant pour fail2ban.
    # Le rate-limit applicatif est par-pubkey dans policy.py, pas par-IP.

    info {
        name = "Nostr Map Relay"
        description = "Relay Nostr public francophone, ouvert à tous. https://nostrmap.fr"
        contact = "npub1n2878xq8jmacnjsyun6a0nrys7tcglzq8znzv05s33ddrxupd36q6uhtpg"
        pubkey = "98a5bfe0691dc6f7414bc145c3d96a26dcc0f42f541e30448ec6384c425c7b5b"
    }

    maxWebsocketPayloadSize = 131072
    autoPingSeconds = 55
    maxFilterLimit = 500
    # 50 = norme pour relais publics avec ressources moyennes (nostr.wine, purplepag.es).
    # Default strfry / nos.lol / primal : 20. Damus : 300 (grosse infra). 50 = compromis.
    maxSubsPerConnection = 50

    writePolicy {
        plugin = "/etc/strfry/policy.py"
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll    = false
        dumpInEvents = false
        dumpInReqs   = false
        metrics      = false
    }

    numThreads {
        ingester   = 3
        reqWorker  = 3
        reqMonitor = 3
        negentropy = 2
    }
}
