[Service]
# Limites adaptees a 7.6 Gi RAM (VPS upgrade 2026-05-02).
# Marge de ~1.6 Gi pour le systeme (Caddy, sshd, fail2ban, kernel cache).
MemoryHigh=6000M
MemoryMax=7000M
TasksMax=4096

# Hardening systemd (audit 2026-05-02). strfry tourne en root par defaut,
# ces directives reduisent la surface d attaque sans le degrader.
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=/var/lib/strfry
ProtectHome=yes
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
RestrictRealtime=yes
LockPersonality=yes

# Garde-fou anti-recreation de DB vide.
# Refuse de demarrer si /var/lib/strfry/data.mdb est absent ou suspectement petit.
# Sans ca, strfry creerait silencieusement une DB vide -> perte apparente des events.
# Si ce check bloque le demarrage, c'est INTENTIONNEL : restaurer la DB depuis backup
# (restic ou /var/backups/server-backup/strfry-export-latest.jsonl.gz) avant de relancer.
ExecStartPre=/bin/sh -c '[ -s /var/lib/strfry/data.mdb ] || { echo "FATAL: /var/lib/strfry/data.mdb absent. Refus de demarrer pour ne pas creer une DB vide. Restaurer la DB avant."; exit 1; }'
ExecStartPre=/bin/sh -c 'SZ=$(stat -c %%s /var/lib/strfry/data.mdb); [ "$SZ" -gt 1048576 ] || { echo "FATAL: /var/lib/strfry/data.mdb fait $SZ octets (< 1 Mo). DB probablement corrompue ou vide. Refus de demarrer."; exit 1; }'
